## Configuration file for exp_local.py

# Grid hyperparameters: each is a list, swept as a cartesian product (one
# full sweep over s_sizes x n_repetitions x weighting schemas per
# combination). A single value still needs list syntax, e.g. `ess: [2]`.
n_clients: [10]      # Number of clients
ess: [2, 10, 50, 100]             # Equivalent sample size for local IDM
prob_shift: [0.0, 0.5]  # Probability of shift in parameters between clients. 0: iid data. >0: non-iid data
alpha: [0.1, 1]         # Dirichlet concentration for parameter perturbation (higher = smaller shift)

client_num: 0
s_sizes:
  min: 5
  max: 510
  step: 5
# All 3 weighting schemas (see exp_local.py's WEIGHTING_SCHEMES / PriorCPT.compute)
# are computed in every run, so there is no `weighting` hyperparameter here.
res_path: results_local
bn_base_path: ./cancer.bif
n_repetitions: 50
n_bns: 100
# Archive every task's CPT snapshots to results/models/<task_id>.pkl (see
# snapshot_cpts in exp_local.py).
save_models: False
# Retire and replace each worker process after this many tasks: works around
# a native memory leak (~5.5MB/task) in the `hopsy` MCMC sampler used for the
# min/mean JSD. Lower = tighter memory bound, more respawn overhead; defaults to 100.
max_tasks_per_child: 50

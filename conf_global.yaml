## Configuration file for exp_global.py.

# Grid hyperparameters: each is a list, swept as a cartesian product. A
# single value still needs list syntax, e.g. `n_clients: [10]`.
n_clients: [10]            # Number of clients. 
ess: [2, 10, 50, 100]  # Equivalent sample size for local IDM.
      
prob_shift: [0.5]           # Fixed: 0 would make every mechanism's ground
                            # truth a single giant cluster, trivializing the
                            # clustering task.
alpha: [0.1, 1]              # Dirichlet concentration for parameter perturbation.
                            

s_sizes:
  min: 5
  max: 510
  step: 5

res_path: results_global
bn_base_path: ./cancer.bif
n_repetitions: 50
# Archive every task's CPT snapshots (bn_mle, local IDM, per-weighting
# MOSAIC-updated credal sets) for EVERY client (all n_clients are targets
# here, unlike exp_local.py's single client_num) to
# results_global/models/<task_id>.pkl (see snapshot_cpts in exp_global.py).
save_models: False
max_tasks_per_child: 50

